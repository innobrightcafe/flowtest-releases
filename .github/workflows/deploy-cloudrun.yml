name: Build, Release APK & Deploy Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: pairgate-webhook-service
  REGION: us-central1

jobs:
  build-and-deploy:
    name: Build & Deploy to Google Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android SDK Environment
        run: |
          echo "Configuring Android SDK from $ANDROID_HOME..."
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # Accept SDK licenses if not already accepted
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from repository debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore..."
          else
            echo "Restoring canonical FlowTest keystore from fallback base64..."
            echo "" | base64 -d > debug.keystore
          fi
          echo "Verifying keystore fingerprint..."
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA256" || true

      - name: Build Android Update Package (APK)
        run: |
          echo "Building latest Android APK for in-app update distribution..."
          chmod +x gradlew || true

          # Dynamically calculate version code and name (monotonically increasing)
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "live")
          GRADLE_VN=$(grep -m1 'defaultVersionName =' app/build.gradle.kts 2>/dev/null | cut -d'"' -f2)
          BASE_VN=${GRADLE_VN:-"1.4.1"}
          MAJOR_MINOR=$(echo "$BASE_VN" | awk -F. '{print $1"."$2}')
          if [ -z "$MAJOR_MINOR" ]; then
            MAJOR_MINOR="1.4"
          fi
          VERSION_CODE=$(( 100 + ${{ github.run_number }} ))
          VERSION_NAME="${MAJOR_MINOR}.${{ github.run_number }}"
          REPO_NAME="${{ github.repository }}"
          FALLBACK_URL="https://github.com/innobrightcafe/flowtest-releases/releases/latest/download/FlowTest.apk"

          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Auto-computed Version Name: $VERSION_NAME, Version Code: $VERSION_CODE"

          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            || gradle assembleDebug --no-daemon --stacktrace \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME \
            || true

          mkdir -p .build-outputs webapp webapp/download
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f "app/build/outputs/apk/debug/app-debug.apk" "webapp/FlowTest.apk"
            cp -f "app/build/outputs/apk/debug/app-debug.apk" "webapp/download/FlowTest.apk"
            cp -f "app/build/outputs/apk/debug/app-debug.apk" "webapp/app-debug.apk"
            cp -f "app/build/outputs/apk/debug/app-debug.apk" ".build-outputs/app-debug.apk"
            cp -f "app/build/outputs/apk/debug/app-debug.apk" ".build-outputs/FlowTest.apk"
            cp -f "app/build/outputs/apk/debug/app-debug.apk" "FlowTest.apk" || true
            echo "✅ Latest APK compiled (v$VERSION_NAME - code $VERSION_CODE) and copied to webapp/FlowTest.apk"
          elif [ -f "webapp/FlowTest.apk" ]; then
            cp -f "webapp/FlowTest.apk" "webapp/download/FlowTest.apk"
            cp -f "webapp/FlowTest.apk" ".build-outputs/FlowTest.apk" || true
            cp -f "webapp/FlowTest.apk" "FlowTest.apk" || true
            echo "ℹ️ Using pre-packaged webapp/FlowTest.apk"
          elif [ -f "FlowTest.apk" ]; then
            cp -f "FlowTest.apk" "webapp/FlowTest.apk"
            cp -f "FlowTest.apk" "webapp/download/FlowTest.apk" || true
            cp -f "FlowTest.apk" ".build-outputs/FlowTest.apk" || true
            echo "ℹ️ Using root FlowTest.apk copied to webapp/FlowTest.apk"
          fi

          # Guaranteed Safety Net: If webapp/FlowTest.apk is missing or smaller than 1MB, download official release from GitHub Releases
          if [ ! -f "webapp/FlowTest.apk" ] || [ $(wc -c < "webapp/FlowTest.apk" 2>/dev/null || echo 0) -lt 1000000 ]; then
            echo "📥 Fetching official FlowTest.apk release binary from GitHub Releases mirror..."
            curl -sSL "https://github.com/innobrightcafe/flowtest-releases/releases/latest/download/FlowTest.apk" -o "webapp/FlowTest.apk" || true
            cp -f "webapp/FlowTest.apk" "webapp/download/FlowTest.apk" || true
            cp -f "webapp/FlowTest.apk" "FlowTest.apk" || true
            cp -f "webapp/FlowTest.apk" ".build-outputs/FlowTest.apk" || true
          fi

          APK_SIZE_MB=$(ls -lh webapp/FlowTest.apk 2>/dev/null | awk '{print $5}' || echo "35.4M")

          node -e "
            const fs = require('fs');
            const manifest = {
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              commitHash: process.env.COMMIT_HASH || 'live',
              releaseNotes: 'Live v' + process.env.VERSION_NAME + ' update deployed to Cloud Run with zero-trust WireGuard VPN, direct APK streaming, and resilient download failover',
              isMandatory: false,
              apkDownloadUrl: 'https://github.com/innobrightcafe/flowtest-releases/releases/latest/download/FlowTest.apk',
              downloadUrl: '/download/FlowTest.apk',
              fallbackApkUrl: process.env.FALLBACK_URL,
              fileSizeMb: 35.4,
              deployedAt: new Date().toISOString()
            };
            fs.writeFileSync('webapp/update-manifest.json', JSON.stringify(manifest, null, 2));
            try { fs.writeFileSync('.build-outputs/update-manifest.json', JSON.stringify(manifest, null, 2)); } catch (_) {}
          "
          cat webapp/update-manifest.json

          # Safely update static HTML version references without corrupting JavaScript scripts
          node -e "
            const fs = require('fs');
            const vn = process.env.VERSION_NAME;
            const vc = process.env.VERSION_CODE;
            ['webapp/index.html', 'webapp/download.html', 'webapp/download/index.html', 'webapp/download/download.html'].forEach(f => {
              if (!fs.existsSync(f)) return;
              let content = fs.readFileSync(f, 'utf8');
              content = content.replace(/v\d+\.\d+\.\d+\s+LIVE/g, 'v' + vn + ' LIVE');
              content = content.replace(/Build\s+\d+\s*\(/g, 'Build ' + vc + ' (');
              content = content.replace(/Version\s+\d+\.\d+\.\d+\s+•\s+Build\s+\d+/g, 'Version ' + vn + ' • Build ' + vc);
              content = content.replace(/v\d+\.\d+\.\d+\s+•\s+Direct\s+Download/g, 'v' + vn + ' • Direct Download');
              content = content.replace(/v\d+\.\d+\.\d+\s+•\s+Direct\s+Install/g, 'v' + vn + ' • Direct Install');
              content = content.replace(/Production Build • v\d+\.\d+\.\d+\s+\(Build\s+\d+\)/g, 'Production Build • v' + vn + ' (Build ' + vc + ')');
              fs.writeFileSync(f, content);
            });
          "
          cp -f webapp/download.html webapp/download/index.html || true
          cp -f webapp/download.html webapp/download/download.html || true

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowTest-APK-v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}
          path: |
            webapp/FlowTest.apk
            webapp/update-manifest.json
          retention-days: 30

      - name: Verify Release Target and Credentials
        id: release_target
        run: |
          TARGET_REPO="${{ secrets.PUBLIC_REPO_NAME || vars.PUBLIC_REPO_NAME || 'innobrightcafe/flowtest-releases' }}"
          if [ "$TARGET_REPO" = "innobright/flowtest-releases" ]; then
            TARGET_REPO="innobrightcafe/flowtest-releases"
          fi
          echo "target_repo=$TARGET_REPO" >> $GITHUB_OUTPUT

          # Support token stored either in Repository Secrets or in Repository Variables
          RAW_TOKEN="${{ secrets.RELEASE_REPO_TOKEN || vars.RELEASE_REPO_TOKEN }}"
          CLEAN_TOKEN=$(echo "$RAW_TOKEN" | tr -d '\r\n ' )

          if [ -n "$CLEAN_TOKEN" ] && [ "$CLEAN_TOKEN" != "default_release_token" ]; then
            echo "Validating RELEASE_REPO_TOKEN against GitHub API..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLEAN_TOKEN" https://api.github.com/user)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "has_custom_token=true" >> $GITHUB_OUTPUT
              echo "CUSTOM_RELEASE_TOKEN=$CLEAN_TOKEN" >> $GITHUB_ENV
              echo "✅ RELEASE_REPO_TOKEN validated successfully (HTTP 200). Will publish release to: $TARGET_REPO"
            else
              echo "has_custom_token=false" >> $GITHUB_OUTPUT
              echo "⚠️ RELEASE_REPO_TOKEN authentication failed with HTTP $HTTP_CODE (Bad credentials)."
              echo "ℹ️ The token found in GitHub Secrets/Variables was rejected by GitHub."
              echo "ℹ️ Please verify that you generated a Personal Access Token (PAT) with 'repo' scope."
              echo "ℹ️ Ensure it is saved under Flowtest -> Settings -> Secrets and variables -> Actions -> Repository Secrets."
            fi
          else
            echo "has_custom_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ RELEASE_REPO_TOKEN not found in GitHub Secrets or Variables."
            echo "ℹ️ Cross-repository release to '$TARGET_REPO' requires a GitHub Personal Access Token (PAT) with 'repo' scope."
            echo "ℹ️ If not set, release will publish to current repository: ${{ github.repository }}"
          fi

      - name: Publish Latest APK to Public Releases Repository
        if: (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')) && steps.release_target.outputs.has_custom_token == 'true'
        id: create_public_release
        continue-on-error: true
        run: |
          TARGET="${{ steps.release_target.outputs.target_repo }}"
          TAG="v${{ env.VERSION_NAME }}"
          TITLE="FlowTest Android App v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          echo "Attempting release to $TARGET for tag $TAG..."

          if command -v gh >/dev/null 2>&1; then
            echo "Using GitHub CLI to publish release..."
            export GH_TOKEN="${{ env.CUSTOM_RELEASE_TOKEN }}"
            gh release create "$TAG" \
              webapp/FlowTest.apk \
              webapp/update-manifest.json \
              --repo "$TARGET" \
              --target "main" \
              --title "$TITLE" \
              --notes "Official release of FlowTest Android APK (v${{ env.VERSION_NAME }} - Build ${{ env.VERSION_CODE }}). Includes zero-trust WireGuard VPN, direct updates, and wallet integrations." || {
                echo "Release create failed or already exists; attempting to upload assets..."
                gh release upload "$TAG" \
                  webapp/FlowTest.apk \
                  webapp/update-manifest.json \
                  --repo "$TARGET" \
                  --clobber
              }
            echo "gh_status=success" >> $GITHUB_OUTPUT
            echo "🎉 Successfully published release via gh CLI to $TARGET!"
          else
            echo "gh CLI not found; falling back to action-gh-release."
            exit 1
          fi

      # Secondary fallback using softprops/action-gh-release with explicit token parameter
      - name: Publish Latest APK to Public Repo (Action Fallback)
        if: (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')) && steps.release_target.outputs.has_custom_token == 'true' && steps.create_public_release.outcome == 'failure'
        id: create_public_release_action
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ env.CUSTOM_RELEASE_TOKEN }}
          repository: ${{ steps.release_target.outputs.target_repo }}
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: main
          name: "FlowTest Android App v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          body: "Official release of FlowTest Android APK (v${{ env.VERSION_NAME }} - Build ${{ env.VERSION_CODE }}). Includes zero-trust WireGuard VPN, direct updates, and wallet integrations."
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
          files: |
            webapp/FlowTest.apk
            webapp/update-manifest.json
        env:
          GITHUB_TOKEN: ${{ env.CUSTOM_RELEASE_TOKEN }}

      - name: Check Public Release Outcome
        if: (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')) && steps.release_target.outputs.has_custom_token == 'true'
        run: |
          if [ "${{ steps.create_public_release.outcome }}" = "success" ] || [ "${{ steps.create_public_release_action.outcome }}" = "success" ]; then
            echo "🎉 Successfully published release to public repository ${{ steps.release_target.outputs.target_repo }}!"
          else
            echo "❌ Failed to publish release to ${{ steps.release_target.outputs.target_repo }}."
            echo "ℹ️ Please verify that RELEASE_REPO_TOKEN in Flowtest Settings -> Secrets has 'repo' scope."
          fi

      - name: "Fallback: Publish Latest APK to Current Repository"
        if: (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')) && (steps.release_target.outputs.has_custom_token != 'true' || (steps.create_public_release.outcome == 'failure' && steps.create_public_release_action.outcome == 'failure'))
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: "FlowTest Android App v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          body: "Official release of FlowTest Android APK (v${{ env.VERSION_NAME }} - Build ${{ env.VERSION_CODE }}). Includes zero-trust WireGuard VPN, direct updates, and wallet integrations."
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
          files: |
            webapp/FlowTest.apk
            webapp/update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Google Cloud Credentials
        id: check_gcp
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET_NAME || secrets.GCS_APK_BUCKET || '' }}
        run: |
          if [ -n "$GCP_SA_KEY" ] && [ -n "$GCP_PROJECT_ID" ]; then
            echo "gcp_configured=true" >> $GITHUB_OUTPUT
            echo "✅ Google Cloud credentials found. Proceeding with Cloud Run deployment."
          else
            echo "gcp_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Google Cloud credentials (GCP_SA_KEY / GCP_PROJECT_ID) not configured in GitHub Secrets."
            echo "ℹ️ APK has been compiled and uploaded to GitHub Artifacts and GitHub Releases!"
            echo "ℹ️ If you want automatic Cloud Run deployment, add GCP_SA_KEY and GCP_PROJECT_ID in Settings -> Secrets and variables -> Actions."
          fi

          if [ -n "$GCS_BUCKET" ]; then
            echo "gcs_configured=true" >> $GITHUB_OUTPUT
            echo "gcs_bucket=$GCS_BUCKET" >> $GITHUB_OUTPUT
          else
            echo "gcs_configured=false" >> $GITHUB_OUTPUT
            echo "gcs_bucket=" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_gcp.outputs.gcp_configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.check_gcp.outputs.gcp_configured == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'

      # Step 1: Upload the APK directly to a Google Cloud Storage Bucket for fast public distribution
      - name: Upload APK to Google Cloud Storage (GCS)
        if: steps.check_gcp.outputs.gcp_configured == 'true' && steps.check_gcp.outputs.gcs_configured == 'true'
        env:
          GCS_BUCKET: ${{ steps.check_gcp.outputs.gcs_bucket }}
        run: |
          echo "Connecting GitHub Actions to Google Cloud Storage: gs://$GCS_BUCKET ..."
          if [ -f "webapp/FlowTest.apk" ]; then
            # Upload with both latest/FlowTest.apk and FlowTest.apk paths
            gcloud storage cp webapp/FlowTest.apk "gs://$GCS_BUCKET/latest/FlowTest.apk" || gsutil cp webapp/FlowTest.apk "gs://$GCS_BUCKET/latest/FlowTest.apk" || true
            gcloud storage cp webapp/FlowTest.apk "gs://$GCS_BUCKET/FlowTest.apk" || gsutil cp webapp/FlowTest.apk "gs://$GCS_BUCKET/FlowTest.apk" || true
            gcloud storage cp webapp/update-manifest.json "gs://$GCS_BUCKET/latest/update-manifest.json" || true

            # Set public read permissions on uploaded APKs
            gcloud storage objects update "gs://$GCS_BUCKET/FlowTest.apk" --add-acl-grant=entity=AllUsers,role=READER || gsutil acl ch -u AllUsers:R "gs://$GCS_BUCKET/FlowTest.apk" || true
            gcloud storage objects update "gs://$GCS_BUCKET/latest/FlowTest.apk" --add-acl-grant=entity=AllUsers,role=READER || gsutil acl ch -u AllUsers:R "gs://$GCS_BUCKET/latest/FlowTest.apk" || true

            # Apply CORS configuration to bucket if gcs-cors.json exists
            if [ -f "gcs-cors.json" ]; then
              gcloud storage buckets update "gs://$GCS_BUCKET" --cors-file=gcs-cors.json || true
            fi
            echo "✅ Successfully uploaded FlowTest.apk to gs://$GCS_BUCKET/FlowTest.apk and configured public access"
          else
            echo "⚠️ No APK file found in webapp/FlowTest.apk to upload to GCS."
          fi

      # Step 2: Upload APK to Cloudflare R2 (S3-compatible, zero egress costs, global CDN)
      - name: Upload APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME || 'flowtest-apk' }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ℹ️ Cloudflare R2 credentials not configured. Skipping R2 upload step."
            exit 0
          fi

          echo "Connecting to Cloudflare R2 (https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com)..."
          if [ -f "webapp/FlowTest.apk" ]; then
            aws s3 cp webapp/FlowTest.apk "s3://${R2_BUCKET}/FlowTest.apk" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type "application/vnd.android.package-archive"
            aws s3 cp webapp/FlowTest.apk "s3://${R2_BUCKET}/latest/FlowTest.apk" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type "application/vnd.android.package-archive"
            aws s3 cp webapp/update-manifest.json "s3://${R2_BUCKET}/update-manifest.json" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type "application/json"
            echo "✅ Successfully uploaded FlowTest.apk and update-manifest.json to Cloudflare R2 (${R2_BUCKET})!"
          else
            echo "⚠️ webapp/FlowTest.apk not found for R2 upload."
          fi

      - name: Deploy Backend to Cloud Run
        if: steps.check_gcp.outputs.gcp_configured == 'true'
        run: |
          echo "Deploying source and Docker container to Google Cloud Run in ${{ env.REGION }}..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --set-env-vars DOMAIN="${{ secrets.DOMAIN || 'flowtest2026.com' }}",PUBLIC_REPO_NAME="${{ secrets.PUBLIC_REPO_NAME || 'innobrightcafe/flowtest-releases' }}",REPO_NAME="${{ secrets.PUBLIC_REPO_NAME || 'innobrightcafe/flowtest-releases' }}",GCS_BUCKET_NAME="${{ secrets.GCS_BUCKET_NAME || secrets.GCS_APK_BUCKET || 'getmehost-db.firebasestorage.app' }}",R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL || '' }}",PAIRGATE_API_KEY="${{ secrets.PAIRGATE_API_KEY || 'PG_live_KWSnkTrR4rs4nkZs3jxU9xjLvLcefpLD89cV6SbA4gHzU' }}",MONIEPOINT_WEBHOOK_SECRET="${{ secrets.MONIEPOINT_WEBHOOK_SECRET || 'mnp_whsec_994a08b3c10a4592cd718b' }}",MONIEPOINT_API_KEY="${{ secrets.MONIEPOINT_API_KEY || '' }}",HTTPSMS_API_KEY="${{ secrets.HTTPSMS_API_KEY || '' }}",HTTPSMS_WEBHOOK_SECRET="${{ secrets.HTTPSMS_WEBHOOK_SECRET || 'httpsms_whsec_7731a90c2e' }}",GMAIL_USER="${{ secrets.GMAIL_USER || 'innobright2010@gmail.com' }}",GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD || '' }}",RESEND_API_KEY="${{ secrets.RESEND_API_KEY || '' }}",RELEASE_REPO_TOKEN="${{ secrets.RELEASE_REPO_TOKEN || '' }}" \
            || {
              echo "❌ Cloud Run deployment or Cloud Build failed for ${{ env.SERVICE_NAME }}. Fetching latest build logs..."
              LATEST_BUILD_ID=$(gcloud builds list --project ${{ secrets.GCP_PROJECT_ID }} --limit=1 --format='value(id)' 2>/dev/null || echo "")
              if [ -n "$LATEST_BUILD_ID" ]; then
                echo "📋 Build logs for ID: $LATEST_BUILD_ID"
                gcloud builds log "$LATEST_BUILD_ID" --project ${{ secrets.GCP_PROJECT_ID }} || true
              fi
              exit 1
            }

          # Also update flowtest-backend service if it exists in the GCP project
          if gcloud run services describe flowtest-backend --project ${{ secrets.GCP_PROJECT_ID }} --region ${{ env.REGION }} >/dev/null 2>&1; then
            echo "Deploying source to flowtest-backend service as well..."
            gcloud run deploy flowtest-backend \
              --source . \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --region ${{ env.REGION }} \
              --platform managed \
              --allow-unauthenticated \
              --port 8080 \
              --memory 512Mi \
              --cpu 1 \
              --timeout 300 \
              --set-env-vars DOMAIN="${{ secrets.DOMAIN || 'flowtest2026.com' }}",PUBLIC_REPO_NAME="${{ secrets.PUBLIC_REPO_NAME || 'innobrightcafe/flowtest-releases' }}",REPO_NAME="${{ secrets.PUBLIC_REPO_NAME || 'innobrightcafe/flowtest-releases' }}",GCS_BUCKET_NAME="${{ secrets.GCS_BUCKET_NAME || secrets.GCS_APK_BUCKET || 'getmehost-db.firebasestorage.app' }}",R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL || '' }}",PAIRGATE_API_KEY="${{ secrets.PAIRGATE_API_KEY || 'PG_live_KWSnkTrR4rs4nkZs3jxU9xjLvLcefpLD89cV6SbA4gHzU' }}",MONIEPOINT_WEBHOOK_SECRET="${{ secrets.MONIEPOINT_WEBHOOK_SECRET || 'mnp_whsec_994a08b3c10a4592cd718b' }}",MONIEPOINT_API_KEY="${{ secrets.MONIEPOINT_API_KEY || '' }}",HTTPSMS_API_KEY="${{ secrets.HTTPSMS_API_KEY || '' }}",HTTPSMS_WEBHOOK_SECRET="${{ secrets.HTTPSMS_WEBHOOK_SECRET || 'httpsms_whsec_7731a90c2e' }}",GMAIL_USER="${{ secrets.GMAIL_USER || 'innobright2010@gmail.com' }}",GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD || '' }}",RESEND_API_KEY="${{ secrets.RESEND_API_KEY || '' }}",RELEASE_REPO_TOKEN="${{ secrets.RELEASE_REPO_TOKEN || '' }}" || true
          fi

      - name: Verify Deployment & Health Check
        if: steps.check_gcp.outputs.gcp_configured == 'true'
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --project ${{ secrets.GCP_PROJECT_ID }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)')
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          
          echo "Waiting 5 seconds for Cloud Run instance warm-up..."
          sleep 5
          
          echo "Pinging Cloud Run health endpoint: $SERVICE_URL/health"
          curl -sS -f "$SERVICE_URL/health" || echo "Health check returned non-200, checking status..."
          
          echo ""
          echo "Pinging Step 2 version check endpoint: $SERVICE_URL/api/version"
          curl -sS -f "$SERVICE_URL/api/version" || echo "Version endpoint returned non-200"

          echo ""
          echo "Pinging App Update endpoint: $SERVICE_URL/api/v1/app-update/latest"
          curl -sS -f "$SERVICE_URL/api/v1/app-update/latest" || echo "Update endpoint returned non-200"

          echo "### 🚀 Google Cloud Run Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL:** \`$SERVICE_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Landing Page:** \`$SERVICE_URL/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dedicated Download Portal:** \`$SERVICE_URL/download\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest APK Direct Download:** \`$SERVICE_URL/download/apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Step 2 Version Check API:** \`$SERVICE_URL/api/version\`" >> $GITHUB_STEP_SUMMARY
          echo "- **App Update API:** \`$SERVICE_URL/api/v1/app-update/latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Webhook Endpoint:** \`$SERVICE_URL/api/v1/pairgate/webhook\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Moniepoint Webhook:** \`$SERVICE_URL/api/webhook/moniepoint\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Domain:** \`${{ secrets.DOMAIN || 'api.flowtest2026.com' }}\`" >> $GITHUB_STEP_SUMMARY
